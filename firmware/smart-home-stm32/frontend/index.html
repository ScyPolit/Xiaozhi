<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#26234;&#33021;&#23478;&#23621; LED &#25511;&#21046;&#31995;&#32479;</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">STM32F103C8T6 + ESP8266-01S AT</p>
          <h1>&#26234;&#33021;&#23478;&#23621; LED &#25511;&#21046;&#31995;&#32479;</h1>

        <button id="refreshButton" class="button" type="button">&#21047;&#26032;&#29366;&#24577;</button>

        <button id="allOffButton" class="button danger" type="button">&#20840;&#20851;</button>
        <div id="loadingText" class="loading" hidden>&#25805;&#20316;&#20013;...</div>
      </section>

      <section id="errorBox" class="error" hidden></section>

      <section id="ledGrid" class="led-grid" aria-label="light list"></section>
    </main>

    <script src="./src/api.js" defer></script>
    <script src="./src/main.js" defer></script>
  </body>
</html>
